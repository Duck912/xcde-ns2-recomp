<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XC:DE NS2 recomp</title>
    <link rel="icon" type="image/png" href="/icon.png" />
  </head>
  <body>
    <!-- Background slot: see the notes at the top of src/theme.css. -->
    <div id="bg" aria-hidden="true">
      <video id="bg-video" muted loop autoplay playsinline hidden></video>
    </div>

    <div id="app">
      <!-- The window has no system frame (tauri.conf.json decorations: false): this bar is its title bar. -->
      <header id="titlebar" data-tauri-drag-region>
        <div class="tb-brand" data-tauri-drag-region>
          <img src="/icon.png" alt="" class="tb-icon" data-tauri-drag-region />
          <span class="tb-name" id="tb-name" data-tauri-drag-region>XC:DE Recomp</span>
        </div>
        <div class="tb-center" id="tb-center" data-tauri-drag-region></div>
        <div class="tb-actions">
          <button class="tb-btn" id="tb-update" type="button"><i data-lucide="circle-arrow-up"></i></button>
          <button class="tb-btn" id="tb-saves" type="button"><i data-lucide="save"></i></button>
          <button class="tb-btn" id="tb-settings" type="button"><i data-lucide="settings"></i></button>
          <button class="tb-btn round" id="tb-min" type="button"><i data-lucide="minus"></i></button>
          <button class="tb-btn round" id="tb-close" type="button"><i data-lucide="x"></i></button>
        </div>
      </header>
      <main id="view"></main>
    </div>
    <div id="toast" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
